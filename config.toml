# =====================================================================
#  FreeSignageKit  設定ファイル (config.toml)
# =====================================================================
#
#  このファイルは実行ファイル(.AppImage / .exe / FSKit.py)と
#  同じフォルダに置いてください。
#
#    例) my_signage.AppImage
#        config.toml   ← これと同じ階層に置く
#
#  ここに書かれている値は「デフォルト値」そのものです。
#  config.toml が見つからない場合、FreeSignageKit はこの内容のまま
#  動作します。書き換えたい項目だけ残して、他は削除してもかまいません
#  (プログラム側でデフォルト値と自動的にマージされるため)。
#
#  値を変更したら、ブラウザを再起動すると反映されます。
# =====================================================================


[browser]
# 起動時に開くホームページのURL
home_url = "http://localhost"

# 全画面表示で起動するか (true/false)
fullscreen = true

# ホームタブを縦タブ一覧に表示するか
# false: 通常時はタブパネルを隠し、サブタブが開いたときだけ表示する
# true : 常にホームタブも一覧に表示する
show_home_in_tabs = false

# ホームページが閉じられた/消えた/読み込みに失敗した場合、再表示を試みるまでの
# 待ち時間 (ミリ秒)。失敗するたびにこの値の指数バックオフ(2倍ずつ)で待ち時間が延び、
# 一度でも成功するとこの初期値にリセットされます。
home_retry_ms = 2000

# home_retry_ms の指数バックオフの上限 (ミリ秒)。
# サーバーが長時間ダウンしていても、この間隔を超えて再試行間隔が伸びることはありません。
home_retry_max_ms = 60000

# 送信するUser-Agent文字列。空文字なら既定のChromium UAを使用
user_agent = ""

# JavaScriptを有効にするか
javascript = true

# 動画・音声の自動再生を許可するか
autoplay = true


[navbar]
# ツールバー(戻る/進む/再読み込み/URLバー)を表示するか
show = true

# URL入力欄を表示するか (showがtrueの場合のみ有効)
show_url_bar = true

# 戻る/進むボタンを表示するか (showがtrueの場合のみ有効)
show_back_forward = true

# 再読み込みボタンを表示するか (showがtrueの場合のみ有効)
show_reload = true


[kiosk]
# アプリを終了するショートカットキー
exit_shortcut = "Ctrl+Shift+Q"

# 右クリックメニュー(コンテキストメニュー)を無効化するか
disable_context_menu = true

# ハードリスタート(アプリ自体を丸ごと終了→再起動)の間隔 (時間単位)。
# 0 以下を指定すると無効になります(既定値)。
# 長時間稼働によるメモリ増大等をリセットする目的の機能です。
restart_interval_hours = 0

# ハードリスタートを実行する時刻を "HH:MM" (24時間表記) で指定します。
# 空文字 "" の場合は、起動時刻から restart_interval_hours 経過した時点で
# (時刻を問わず)すぐに再起動します。
# 値を指定した場合は、「経過時間の条件を満たした後、最初にこの時刻を迎えたタイミング」
# で再起動します(例: 深夜の閑散時間帯を指定して利用者への影響を避ける用途を想定)。
restart_at = ""


[chromium]
# 追加のChromium起動フラグ (スペース区切りで複数指定可能)
# 例: extra_flags = "--disable-gpu --force-dark-mode"
extra_flags = ""

# VA-API によるハードウェア動画支援を有効にするか (Linux/組み込み向け)
vaapi = false

# GPUラスタライズを有効にするか
gpu_rasterization = false

# ゼロコピー転送を有効にするか
zero_copy = false

# 自動再生ポリシーを緩和するか (--autoplay-policy=no-user-gesture-required)
# browser.autoplay = true の場合も自動的に有効になります
autoplay_policy = true


[downloads]
# ダウンロードを許可するホストのリストです。
# 既定(空リスト)ではすべてのダウンロードを拒否します。
#   例: allowed_domains = ["example.com", "*.cdn.example.com"]
#   "*" を指定するとすべてのホストからのダウンロードを許可します。
#   例: allowed_domains = ["*"]
allowed_domains = []


[permissions]
# マイク / カメラ / 位置情報へのアクセスを許可するホストのホワイトリストです。
# 各項目とも既定(空リスト)ではすべて拒否します。
#   例: camera = ["kiosk.example.com"]
# セキュリティ上の理由から、downloads.allowed_domains とは異なり
# "*" (全ホスト許可)はここでは指定できません。指定しても無視され、
# 起動時に警告が出力されます。
microphone   = []
camera       = []
geolocation  = []


[logging]
# ログ出力レベル: "debug" / "info" / "warn" / "error"
#   debug : 権限拒否など高頻度なものまで含め、開発時向けにすべて出力
#   info  : タブ操作・設定読み込み等、通常運用のイベントログを出力(既定値)
#   warn  : ホーム到達不可・レンダラークラッシュ・設定不備等の異常系のみ出力
#   error : 致命的なものだけ出力
# 24時間稼働でログをファイルに保存する運用では、"warn" 以上に絞ることで
# 継続的なディスクI/Oを抑えられます。
level = "info"
